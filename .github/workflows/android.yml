name: Android bootstrap

on:
  push:
    branches: [main, feature/android-bootstrap]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # Avoid setup-android's obsolete "tools" package installation.
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blokr-android-bootstrap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
