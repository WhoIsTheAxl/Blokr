name: Android bootstrap

on:
  push:
    branches: [main, feature/android-bootstrap]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Run core JVM unit tests
        run: bash ./gradlew :minosoft-engine:testDebugUnitTest --stacktrace
      - name: Build Android debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: blokr-android-bootstrap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
